<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cafes Near Me — Find Nearby, Free Map</title>
<meta name="description" content="cafes & coffee shops. Find them near you on a free OpenStreetMap map with directions. No signup, no API key.">
<link rel="canonical" href="https://demo.pages.dev/cafenearme/">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#2563eb">
<meta name="google-site-verification" content="GlkDu5ZL-CyyKjwPSj9d9X3Y2qsHUj_qAwRwxiLr7nI">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<header class="top"><a href="/">← SKM Near Me</a> <b>· Cafes Near Me</b></header>
<div class="wrap">
  <h1>Cafes Near Me</h1>
  <p class="sub">cafes & coffee shops. Free map, no API key — data © OpenStreetMap contributors.</p>
  <div class="controls">
    <input id="city" type="search" placeholder="Type a city, e.g. Delhi" aria-label="City">
    <button class="btn gh" id="go">Search city</button>
    <button class="btn" id="geo">📍 Find near me</button>
  </div>
  <label class="meta">Radius
    <select id="radius"><option value="2">2 km</option><option value="5" selected>5 km</option><option value="10">10 km</option><option value="25">25 km</option></select>
  </label>
  <div class="status" id="status">Tap “Find near me”, or type a city.</div>
  <div id="map"></div>
  <div class="grid" id="out"></div>
  <div class="foot">Map data © OpenStreetMap contributors (ODbL). Nearby search via the free Overpass API. No account or API key required.</div>
</div>
<script>window.CAT={label:"Cafes Near Me",tags:[["amenity", "cafe"]]};</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
